name: address_guard
description: Catch address-poisoning look-alikes before a Flutter wallet sends. Compares a recipient with addresses the user really paid, checks EIP-55, shows a confirm card.
version: 0.1.0
repository: https://github.com/globalmpc/rwa-kit-flutter
issue_tracker: https://github.com/globalmpc/rwa-kit-flutter/issues
topics:
  - wallet
  - security
  - ethereum
  - evm
  - web3

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  pointycastle: ">=3.9.1 <5.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
